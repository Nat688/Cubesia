<link rel="stylesheet" type="text/css" href="styles/style_index.css">
<body>
	<h1><span class="cubesia">Cubesia</span> Minecraft Server</h1>
	<h2>Survival</h2>
	<h3>Informations:</h3>
	<li>Minecraft version: 1.21.8 - 26.3</li>
	<li>
		IP: <span id="ipServeur">cubesia.realistic.host</span>
		<button class="copy-btn" id="copyBtn" onclick="copierIP()">
			<i data-lucide="copy"></i>
		</button>
	</li>
	<script>
		function copierIP() { 
			const ip = document.getElementById("ipServeur").innerText;
			const btn = document.getElementById("copyBtn");
			navigator.clipboard.writeText(ip).then(() => {
				btn.classList.add("success");
  				btn.innerHTML = '<i data-lucide="copy-check"></i>';
  				lucide.createIcons();
				setTimeout(() => {
    				btn.classList.remove("success");
    				btn.innerHTML = '<i data-lucide="copy"></i>';
    				lucide.createIcons();
				}, 1500);
			});
		}
	</script>
	<br/>
	<div class="btn-container">
		<a href="patch.html" class="btn3">
			<i data-lucide="history"></i>Patch
		</a>
		<a href="wiki.html" class="btn3">
			<i data-lucide="book-marked"></i>Wiki
		</a>
	</div>
	<br/>
	<script>
		lucide.createIcons();
	</script>
</body>
