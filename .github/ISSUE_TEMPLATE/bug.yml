name: Bug report
description: Something is broken on the website.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: page
    attributes:
      label: Page
      options: [Home, Wiki, Patch, Rules, Vote, Prices, Staff, Apply, Map, Store, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the page\n2. Click on...\n3. See the error"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android
  - type: dropdown
    id: display
    attributes:
      label: Display settings
      description: Options from the Aa button.
      multiple: true
      options: [Dark theme, Light theme, Minecraft style, Large text, French wiki]
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Drag and drop images here.
