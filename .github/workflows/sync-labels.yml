name: Sync labels
on:
  push:
    branches: [main]
    paths:
      - '.github/labels.json'
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            for (const l of labels) {
              const p = { owner: context.repo.owner, repo: context.repo.repo, name: l.name, color: l.color, description: l.description };
              try {
                await github.rest.issues.updateLabel(p);
              } catch (e) {
                await github.rest.issues.createLabel(p);
              }
            }
